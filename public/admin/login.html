<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Admin Login - Catholic Market</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #05070b;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: -10vw;
      left: 5vw;
      width: 40vw;
      height: 40vw;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: absolute;
      bottom: -15vw;
      right: -5vw;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, rgba(139, 69, 255, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
    }

    .login-container {
      background: rgba(17, 20, 36, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 420px;
      z-index: 10;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(20px);
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .brand {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      margin-bottom: 1rem;
      filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.3));
    }

    .brand h1 {
      color: #f5f7ff;
      font-size: 1.5rem;
      margin: 0;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .brand p {
      color: #8f96b4;
      font-size: 0.9rem;
      margin: 0.5rem 0 0;
    }

    .form-group {
      margin-bottom: 1.5rem;
      text-align: left;
    }

    .form-group label {
      display: block;
      color: #a7b0ce;
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      padding-left: 2.75rem;
    }

    .input-wrapper i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: #6366f1;
      font-size: 0.9rem;
      opacity: 0.8;
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .form-group input {
      width: 100%;
      background: rgba(5, 7, 11, 0.6);
      border: 1px solid #1e2235;
      color: #f5f7ff;
      padding: 0.85rem 1rem 0.85rem 2.75rem;
      border-radius: 10px;
      font-size: 0.95rem;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
      background: rgba(5, 7, 11, 0.8);
    }

    .form-group input:focus+i,
    .form-group input:not(:placeholder-shown)+i {
      opacity: 1;
      color: #8b5cf6;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: white;
      border: none;
      padding: 0.9rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    }

    .btn-submit::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: all 0.5s ease;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
    }

    .btn-submit:hover::before {
      left: 100%;
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .error-message {
      background: rgba(225, 29, 72, 0.1);
      color: #ff4d6d;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid rgba(225, 29, 72, 0.2);
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .error-message.hidden {
      display: none;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #8f96b4;
      text-decoration: none;
      font-size: 0.85rem;
      margin-top: 2rem;
      transition: all 0.2s ease;
    }

    .back-link:hover {
      color: #f5f7ff;
    }
  </style>
</head>

<body>
  <div class="login-container">
    <div class="brand">
      <img src="/img/logo.png" alt="Catholic Market Logo" onerror="this.src='/img/icon-192.png'" />
      <h1>Admin Portal</h1>
      <p>Sign in to manage the platform</p>
    </div>

    <form id="loginForm">
      <div id="loginError" class="error-message hidden">
        <i class="fas fa-exclamation-circle"></i>
        <span></span>
      </div>

      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <i class="fas fa-user"></i>
          <input type="text" id="username" name="username" placeholder="Enter username" required
            autocomplete="username" />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" name="password" placeholder="Enter password" required
            autocomplete="current-password" />
        </div>
      </div>

      <div style="margin-top: 2rem;">
        <button type="submit" class="btn-submit">
          <span>Sign In</span>
          <i class="fas fa-arrow-right"></i>
        </button>
      </div>
    </form>

    <div style="text-align: center;">
      <a href="/" class="back-link">
        <i class="fas fa-arrow-left"></i>
        Back to main site
      </a>
    </div>
  </div>

  <script src="/admin/admin-login.js"></script>
</body>

</html>
