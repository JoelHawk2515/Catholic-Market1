<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Admin Login - Catholic Market</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="hero">
      <div class="hero-content" style="max-width: 450px;">
        <h1>Admin Login</h1>
        <p class="subtitle">Site administrators only</p>
        
        <form id="loginForm" class="admin-form">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autocomplete="username" />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password" />
          </div>
          <div id="loginError" class="error-message hidden"></div>
          <div class="form-actions" style="justify-content: center; margin-top: 1.5rem;">
            <button type="submit" class="btn-primary">Login</button>
          </div>
        </form>
      </div>
    </div>

    <script src="/admin/admin-login.js"></script>
  </body>
</html>
