<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard - Catholic Market</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/style.css" />
</head>

<body class="admin-body" style="background: #05070b; padding: 0;">
  <nav id="top-nav" style="position: relative;">
    <div style="display: flex; align-items: center; gap: 1rem;">
      <img src="/img/logo.png" alt="Logo" class="logo-small" />
      <span style="color: #a7b0ce; font-size: 0.9rem;">Admin Dashboard</span>
    </div>
    <div style="display: flex; gap: 1rem; align-items: center;">
      <a href="/admin/bulk-upload.html" class="btn-refresh"
        style="font-size: 0.85rem; padding: 0.5rem 1rem; text-decoration: none;">📄 Bulk Upload</a>
      <button id="mapCoordinatesBtn" class="btn-refresh" style="font-size: 0.85rem; padding: 0.5rem 1rem;">🗺️ Map
        Coordinates</button>
      <button id="logoutBtn" style="background: #272b3a;">Logout</button>
    </div>
  </nav>

  <div style="padding: 6rem 2rem 2rem; max-width: 1400px; margin: 0 auto;">
    <h1
      style="color: #f5f7ff; margin-bottom: 0.5rem; display: flex; align-items: center; justify-content: space-between;">
      <span>Pending Business Submissions</span>
      <button id="refreshPendingBtn" class="btn-refresh" style="font-size: 0.85rem; padding: 0.5rem 1rem;">🔄
        Refresh</button>
    </h1>
    <p style="color: #a7b0ce; margin-bottom: 2rem;">Review and approve new business listings</p>

    <div id="pendingList" class="admin-pending-list"></div>

    <div style="margin-top: 3rem;">
      <div class="admin-tabs">
        <button class="admin-tab active" data-tab="businesses">Businesses</button>
        <button class="admin-tab" data-tab="parishes">Parishes</button>
        <button class="admin-tab" data-tab="spotlight">Spotlight Queue</button>
      </div>

      <div id="businessesTab" class="admin-tab-content active">
        <div style="margin-bottom: 1.5rem;">
          <button id="addBusinessBtn" class="btn-refresh" style="font-size: 0.9rem; padding: 0.75rem 1.5rem;">+ Add
            Business</button>
        </div>
        <div id="approvedList" class="admin-approved-list"></div>
      </div>

      <div id="parishesTab" class="admin-tab-content">
        <div style="margin-bottom: 1.5rem;">
          <button id="addParishBtn" class="btn-refresh" style="font-size: 0.9rem; padding: 0.75rem 1.5rem;">+ Add
            Parish</button>
        </div>
        <div id="parishesList" class="admin-parishes-list"></div>
      </div>

      <div id="spotlightTab" class="admin-tab-content">
        <div
          style="background: #111424; border: 1px solid #1e2235; border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem;">
          <h3 style="color: #f5f7ff; margin: 0 0 1rem;">Automated Spotlight Schedule</h3>
          <div style="display: flex; gap: 1rem; align-items: flex-end;">
            <div>
              <label style="display: block; color: #a7b0ce; margin-bottom: 0.25rem;">Day of Week</label>
              <select id="spotlightDay"
                style="padding: 0.5rem; border-radius: 4px; border: 1px solid #323854; background: #05070b; color: white;">
                <option value="0">Sunday</option>
                <option value="1">Monday</option>
                <option value="2">Tuesday</option>
                <option value="3">Wednesday</option>
                <option value="4">Thursday</option>
                <option value="5">Friday</option>
                <option value="6">Saturday</option>
              </select>
            </div>
            <div>
              <label style="display: block; color: #a7b0ce; margin-bottom: 0.25rem;">Time (Central)</label>
              <input type="time" id="spotlightTime"
                style="padding: 0.5rem; border-radius: 4px; border: 1px solid #323854; background: #05070b; color: white; color-scheme: dark;" />
            </div>
            <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;">
              <input type="checkbox" id="spotlightActive" style="width: 18px; height: 18px;" />
              <label style="color: #a7b0ce; margin: 0;">Enabled</label>
            </div>
            <button id="saveSpotlightConfigBtn" class="btn-refresh"
              style="font-size: 0.85rem; padding: 0.5rem 1rem;">Save Schedule</button>
          </div>
        </div>

        <p style="color: #8b45ff; margin-bottom: 1rem;"><em>Drag and drop businesses to reorder. The top item is sent
            next.</em></p>
        <div id="spotlightQueueList" class="admin-approved-list">
          <p style="color: #a7b0ce;">Loading queue...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <script src="/admin/admin-dashboard.js"></script>
</body>

</html>
