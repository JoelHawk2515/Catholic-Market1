<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Catholic Market - Find Catholic Businesses</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description"
    content="Discover and support local Catholic-owned businesses in your area. Find verified Catholic businesses on an interactive map." />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <!-- Top Navigation Bar (always visible) -->
  <nav id="top-nav">
    <div class="nav-left">
      <img src="/img/logo.png" alt="Catholic Market" class="logo-small" />
    </div>
    <div class="nav-center">
      <form id="searchForm" class="nav-search-form">
        <div class="nav-search-wrapper">
          <i class="fas fa-search nav-search-icon"></i>
          <input type="text" id="locationInput" placeholder="Search city, state, or zip..." autocomplete="off" />
        </div>
        <button type="submit" id="navSearchBtn">Search</button>
      </form>
    </div>
    <div class="nav-right">
      <button id="myLocationBtn" class="nav-btn nav-btn-location" title="Use My Location">
        <i class="fas fa-location-crosshairs"></i>
        <span class="btn-label">My Location</span>
      </button>
      <a href="/add-business.html" class="nav-btn nav-btn-primary">
        <i class="fas fa-plus"></i>
        <span class="btn-label">Add Business</span>
      </a>
    </div>
  </nav>

  <!-- Main Layout (always visible, no hero) -->
  <div id="mainLayout">
    <div id="map"></div>
    <div id="sidebar">
      <!-- Sponsored Businesses Panel -->
      <div id="sponsoredPanel" class="sponsored-panel" style="display: none;">
        <div class="sponsored-panel-header">
          <span class="sponsored-label"><i class="fas fa-star"></i> Sponsors</span>
        </div>
        <div id="sponsoredGrid" class="sponsored-grid"></div>
      </div>

      <h2 id="sidebarTitle">Local Businesses</h2>
      <div id="filterSection">
        <button id="filterToggle" class="filter-toggle">
          <span>🏷️ Filter by Tags</span>
          <span id="filterArrow" class="arrow">▼</span>
        </button>
        <div id="filterDropdown" class="filter-dropdown hidden">
          <div id="tagsList" class="tags-list"></div>
          <button id="clearFilters" class="clear-filters-btn">Clear All Filters</button>
        </div>
      </div>
      <div id="businessList"></div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script src="/app.js"></script>
</body>

</html>
