<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Catholic Market - Find Catholic Businesses</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no" />
  <meta name="description"
    content="Discover and support local Catholic-owned businesses in your area. Find verified Catholic businesses on an interactive map." />
  <link rel="icon" type="image/png" href="/img/logo.png" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0c0e14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="/img/icon-192.png" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <!-- Top Navigation Bar -->
  <nav id="top-nav">
    <div class="nav-left">
      <button id="mobileSearchOpenBtn" class="nav-btn mobile-only-btn" title="Search">
        <i class="fas fa-search"></i>
      </button>
      <a href="/" class="nav-logo-link">
        <img src="/img/logo.png" alt="Catholic Market" class="logo-small" />
      </a>
    </div>
    <div class="nav-center">
      <form id="searchForm" class="nav-search-form">
        <div class="nav-search-wrapper">
          <i class="fas fa-search nav-search-icon desktop-search-icon"></i>
          <input type="text" id="locationInput" placeholder="Search city, state, or zip..." autocomplete="off" />
        </div>
        <button type="submit" id="navSearchBtn">Search</button>
        <button type="button" id="mobileSearchCloseBtn" class="nav-btn mobile-only-btn" title="Close Search">
          <i class="fas fa-times"></i>
        </button>
      </form>
    </div>
    <div class="nav-right">
      <button id="notificationBtn" class="nav-btn nav-btn-primary pwa-mobile-only" title="Enable Notifications"
        style="display: none;">
        <i class="fas fa-bell"></i>
      </button>
      <button id="myLocationBtn" class="nav-btn nav-btn-location" title="Use My Location">
        <i class="fas fa-location-crosshairs"></i>
        <span class="btn-label">My Location</span>
      </button>
      <a href="/add-business.html" class="nav-btn nav-btn-primary">
        <i class="fas fa-plus"></i>
        <span class="btn-label">Add Business</span>
      </a>
    </div>
  </nav>

  <!-- Main Layout — Vertical Stack -->
  <div id="mainLayout">
    <!-- Map Hero Section -->
    <div id="map-hero">
      <div id="map"></div>
      <!-- Map overlay info -->
      <div class="map-overlay-info" id="mapOverlayInfo">
        <span id="mapLocationLabel"><i class="fas fa-map-marker-alt"></i> Wichita, KS</span>
      </div>
    </div>

    <!-- Content Area: Filter Sidebar + Card Grid -->
    <div id="contentArea">
      <!-- Filter Sidebar -->
      <aside id="filterSidebar">
        <!-- Sponsored Panel -->
        <div id="sponsoredPanel" class="sponsored-panel" style="display: none;">
          <div class="sponsored-panel-header">
            <span class="sponsored-label"><i class="fas fa-star"></i> Sponsors</span>
          </div>
          <div id="sponsoredGrid" class="sponsored-grid"></div>
        </div>

        <!-- Search & Filter -->
        <div class="filter-section">
          <h3 class="filter-section-title"><i class="fas fa-search"></i> Search</h3>
          <div class="local-search-wrapper">
            <i class="fas fa-search local-search-icon"></i>
            <input type="text" id="localSearchInput" placeholder="Search businesses..." autocomplete="off" />
            <button type="button" id="clearLocalSearch" class="clear-local-search hidden" title="Clear"><i
                class="fas fa-times"></i></button>
          </div>
        </div>

        <!-- Category Filter -->
        <div class="filter-section">
          <h3 class="filter-section-title"><i class="fas fa-tags"></i> Categories</h3>
          <div id="categoryFilters" class="filter-categories">
            <!-- Dynamically populated -->
          </div>
        </div>

        <div class="filter-divider"></div>

        <!-- Amenity Filters -->
        <div class="filter-section">
          <h3 class="filter-section-title"><i class="fas fa-sliders-h"></i> Amenities</h3>
          <div class="filter-toggles">
            <button class="filter-toggle" data-filter="hasWifi">
              <i class="fas fa-wifi" style="color: #7da8ff;"></i> Free WiFi
            </button>
            <button class="filter-toggle" data-filter="familyFriendly">
              <i class="fas fa-users" style="color: #f9a8d4;"></i> Family Friendly
            </button>
            <button class="filter-toggle" data-filter="hasParking">
              <i class="fas fa-square-parking" style="color: var(--accent-green);"></i> Parking
            </button>
            <button class="filter-toggle" data-filter="isOpen247">
              <i class="fas fa-clock" style="color: var(--accent-primary);"></i> Open 24/7
            </button>
            <button class="filter-toggle" data-filter="verified">
              <i class="fas fa-check-circle" style="color: var(--accent-green);"></i> Verified Only
            </button>
          </div>
        </div>

        <div class="filter-divider"></div>

        <!-- Results count -->
        <div class="filter-results-count" id="resultsCount"></div>
      </aside>

      <!-- Business Card Grid -->
      <main id="cardGrid">
        <h2 id="sidebarTitle" class="grid-title">Local Businesses</h2>
        <div id="businessList" class="business-grid"></div>
      </main>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script src="/app.js"></script>

  <!-- Service Worker & Push Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const registration = await navigator.serviceWorker.register('/sw.js');
          console.log('SW registered:', registration.scope);

          const isStandalone = window.matchMedia('(display-mode: standalone)').matches
            || window.navigator.standalone === true;

          const notifBtn = document.getElementById('notificationBtn');

          if ('Notification' in window) {
            if (isStandalone && window.innerWidth <= 768 && Notification.permission !== 'granted') {
              if (notifBtn) {
                notifBtn.style.display = 'inline-flex';
                notifBtn.addEventListener('click', async () => {
                  const permission = await Notification.requestPermission();
                  if (permission === 'granted') {
                    await subscribeToPush(registration);
                    notifBtn.style.display = 'none';
                    alert('Notifications enabled!');
                  }
                });
              }
            }

            if (Notification.permission === 'granted') {
              await subscribeToPush(registration);
            } else if (Notification.permission === 'default' && isStandalone) {
              const hasPrompted = localStorage.getItem('cm_notification_prompted');
              if (!hasPrompted) {
                localStorage.setItem('cm_notification_prompted', '1');
                setTimeout(async () => {
                  const permission = await Notification.requestPermission();
                  if (permission === 'granted') {
                    await subscribeToPush(registration);
                    if (notifBtn) notifBtn.style.display = 'none';
                  }
                }, 1500);
              }
            }
          }
        } catch (err) {
          console.error('SW registration failed:', err);
        }
      });
    }

    async function subscribeToPush(registration) {
      try {
        const res = await fetch('/api/push/vapid-key');
        const { publicKey } = await res.json();

        const subscription = await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(publicKey)
        });

        await fetch('/api/push/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(subscription)
        });

        console.log('Push subscription saved');
      } catch (err) {
        console.error('Push subscription failed:', err);
      }
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    // Handle spotlight URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const spotlightId = urlParams.get('spotlight');
    if (spotlightId) {
      const checkForBusiness = setInterval(() => {
        const card = document.querySelector(`[data-business-id="${spotlightId}"]`);
        if (card) {
          clearInterval(checkForBusiness);
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
          card.classList.add('spotlight-highlight');
          setTimeout(() => card.classList.remove('spotlight-highlight'), 4000);
        }
      }, 500);
      setTimeout(() => clearInterval(checkForBusiness), 10000);
    }
  </script>
</body>

</html>
