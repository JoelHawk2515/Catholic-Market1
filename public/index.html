<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Catholic Market - Find Catholic Businesses</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description"
    content="Discover and support local Catholic-owned businesses in your area. Find verified Catholic businesses on an interactive map." />
  <link rel="icon" type="image/png" href="/img/logo.png" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#05070b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="/img/icon-192.png" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <!-- Top Navigation Bar (always visible) -->
  <nav id="top-nav">
    <div class="nav-left">
      <img src="/img/logo.png" alt="Catholic Market" class="logo-small" />
    </div>
    <div class="nav-center">
      <form id="searchForm" class="nav-search-form">
        <div class="nav-search-wrapper">
          <i class="fas fa-search nav-search-icon"></i>
          <input type="text" id="locationInput" placeholder="Search city, state, or zip..." autocomplete="off" />
        </div>
        <button type="submit" id="navSearchBtn">Search</button>
      </form>
    </div>
    <div class="nav-right">
      <button id="myLocationBtn" class="nav-btn nav-btn-location" title="Use My Location">
        <i class="fas fa-location-crosshairs"></i>
        <span class="btn-label">My Location</span>
      </button>
      <a href="/add-business.html" class="nav-btn nav-btn-primary">
        <i class="fas fa-plus"></i>
        <span class="btn-label">Add Business</span>
      </a>
    </div>
  </nav>

  <!-- Main Layout -->
  <div id="mainLayout">
    <div id="map"></div>
    <div id="sidebar">
      <!-- Sponsored Businesses Panel -->
      <div id="sponsoredPanel" class="sponsored-panel" style="display: none;">
        <div class="sponsored-panel-header">
          <span class="sponsored-label"><i class="fas fa-star"></i> Sponsors</span>
        </div>
        <div id="sponsoredGrid" class="sponsored-grid"></div>
      </div>

      <h2 id="sidebarTitle">Local Businesses</h2>
      <div id="filterSection">
        <button id="filterToggle" class="filter-toggle">
          <span>🏷️ Filter by Tags</span>
          <span id="filterArrow" class="arrow">▼</span>
        </button>
        <div id="filterDropdown" class="filter-dropdown hidden">
          <div id="tagsList" class="tags-list"></div>
          <button id="clearFilters" class="clear-filters-btn">Clear All Filters</button>
        </div>
      </div>
      <div id="businessList"></div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script src="/app.js"></script>

  <!-- Service Worker & Push Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const registration = await navigator.serviceWorker.register('/sw.js');
          console.log('SW registered:', registration.scope);

          // Detect if running as installed PWA (standalone mode)
          const isStandalone = window.matchMedia('(display-mode: standalone)').matches
            || window.navigator.standalone === true;

          if ('Notification' in window) {
            if (Notification.permission === 'granted') {
              // Already granted — silently subscribe
              await subscribeToPush(registration);
            } else if (Notification.permission === 'default' && isStandalone) {
              // Only prompt once per install — track in localStorage
              const hasPrompted = localStorage.getItem('cm_notification_prompted');
              if (!hasPrompted) {
                localStorage.setItem('cm_notification_prompted', '1');
                // Small delay so the app loads first before the prompt appears
                setTimeout(async () => {
                  const permission = await Notification.requestPermission();
                  if (permission === 'granted') {
                    await subscribeToPush(registration);
                  }
                }, 1500);
              }
            }
          }
        } catch (err) {
          console.error('SW registration failed:', err);
        }
      });
    }

    async function subscribeToPush(registration) {
      try {
        // Get VAPID public key from server
        const res = await fetch('/api/push/vapid-key');
        const { publicKey } = await res.json();

        const subscription = await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(publicKey)
        });

        // Send subscription to server
        await fetch('/api/push/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(subscription)
        });

        console.log('Push subscription saved');
      } catch (err) {
        console.error('Push subscription failed:', err);
      }
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    // Handle spotlight URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const spotlightId = urlParams.get('spotlight');
    if (spotlightId) {
      // Wait for businesses to load, then scroll to and highlight the spotlighted business
      const checkForBusiness = setInterval(() => {
        const card = document.querySelector(`[data-business-id="${spotlightId}"]`);
        if (card) {
          clearInterval(checkForBusiness);
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
          card.classList.add('spotlight-highlight');
          setTimeout(() => card.classList.remove('spotlight-highlight'), 4000);
        }
      }, 500);
      // Stop checking after 10 seconds
      setTimeout(() => clearInterval(checkForBusiness), 10000);
    }
  </script>
</body>

</html>
